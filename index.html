<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejador de Rotas com Perfil de Elevação</title>
    <meta name="author" content="Onivaldo Miquelino">  
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* 3. Estilos Customizados */
        #map {
            height: 60vh; /* Mapa ocupa 60% da altura da viewport */
            width: 100%;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #elevation-profile {
            height: 30vh; /* Gráfico ocupa 30% da altura da viewport */
            width: 100%;
        }
        .container {
            max-width: 90%;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="text-center mb-4">Planejador de Rotas com Perfil de Elevação</h1>

        <div class="row mb-3">
            <div class="col-md-6">
                <div class="card p-3">
                    <p class="mb-0"><strong>Distância Total:</strong> <span id="total-distance">0.00</span> km</p>
                </div>
            </div>
            <div class="col-md-6 text-end">
                <button id="clear-route" class="btn btn-danger">Limpar Rota</button>
            </div>
        </div>

        <div id="map"></div>

        <h2 class="mt-4 mb-3">Perfil de Elevação Simulado</h2>
        <div class="card p-3">
            <canvas id="elevation-profile"></canvas>
        </div>

        <footer class="text-center mt-5 mb-3 text-muted">
            Clique no mapa para traçar sua rota.
        </footer>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Variáveis Globais
        let map;
        let routePoints = []; // Armazena objetos {lat, lng}
        let polyline;
        let markers = [];
        let elevationChart;

        /**
         * Inicializa o Mapa Leaflet
         */
        function initMap() {
            // Inicializa o mapa centrado em uma localização padrão (Ex: São Paulo, Brasil)
            map = L.map('map').setView([-23.55052, -46.633309], 13);

            // Adiciona o Tile Layer (Tiles de mapa padrão)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            // Inicializa a Polyline
            polyline = L.polyline([], { color: 'blue', weight: 5, opacity: 0.7 }).addTo(map);

            // Evento de Clique no Mapa
            map.on('click', onMapClick);

            // Botão de Limpar Rota
            document.getElementById('clear-route').addEventListener('click', clearRoute);

            // Inicializa o Gráfico
            initChart();
        }

        /**
         * Manipulador de Evento de Clique no Mapa
         * Adiciona um novo ponto à rota.
         */
        function onMapClick(e) {
            const latlng = e.latlng;
            routePoints.push(latlng);

            // 1. Adiciona um Marcador
            const marker = L.marker(latlng).addTo(map);
            markers.push(marker);

            // 2. Atualiza a Polyline
            polyline.addLatLng(latlng);

            // 3. Recalcula e Atualiza Informações
            updateRouteMetrics();
        }

        /**
         * Função de Distância Haversine
         * Calcula a distância entre dois pontos de coordenadas (em km).
         */
        function haversineDistance(latlng1, latlng2) {
            const R = 6371; // Raio da Terra em km
            const lat1 = latlng1.lat * (Math.PI / 180);
            const lat2 = latlng2.lat * (Math.PI / 180);
            const dLat = (latlng2.lat - latlng1.lat) * (Math.PI / 180);
            const dLon = (latlng2.lng - latlng1.lng) * (Math.PI / 180);

            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1) * Math.cos(lat2) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);

            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c; // Distância em km
        }

        /**
         * Função de Simulação de Elevação
         * Cria um perfil de elevação simulado e realista.
         * A elevação muda de forma suave e aleatória em cada segmento.
         */
        function simulateElevation(totalDistance, points) {
            let elevationData = [];
            let cumulativeDistance = 0;
            let currentElevation = 500; // Elevação inicial simulada (metros)

            elevationData.push({ distance: 0, elevation: currentElevation });

            for (let i = 0; i < points.length - 1; i++) {
                const segmentDistance = haversineDistance(points[i], points[i + 1]);
                cumulativeDistance += segmentDistance;

                // Simula uma mudança de elevação baseada no segmento e um pouco de aleatoriedade
                // O fator 150/1000 simula um ganho/perda de 150 metros por km, que é bem montanhoso
                let elevationChange = (Math.random() * 2 - 1) * 150 * segmentDistance / 1000;
                
                // Suaviza a mudança: faz com que a mudança não seja radical demais
                if (i > 0) {
                   const prevChange = elevationData[elevationData.length - 1].elevation - elevationData[elevationData.length - 2].elevation;
                   // Aplica uma inércia, tendendo a continuar subindo ou descendo
                   elevationChange = (elevationChange * 0.5) + (prevChange * 0.5); 
                }

                currentElevation += elevationChange;

                // Garante que a elevação não caia abaixo de um mínimo realista
                currentElevation = Math.max(10, currentElevation); 
                
                elevationData.push({
                    distance: cumulativeDistance,
                    elevation: parseFloat(currentElevation.toFixed(2))
                });
            }
            return elevationData;
        }

        /**
         * Atualiza a distância total e o gráfico de elevação.
         */
        function updateRouteMetrics() {
            let totalDistance = 0;
            if (routePoints.length > 1) {
                for (let i = 0; i < routePoints.length - 1; i++) {
                    totalDistance += haversineDistance(routePoints[i], routePoints[i + 1]);
                }
            }

            // Atualiza a exibição da distância
            document.getElementById('total-distance').textContent = totalDistance.toFixed(2);

            // 2. Gera os dados de elevação simulados
            const elevationData = simulateElevation(totalDistance, routePoints);

            // 3. Atualiza o Gráfico Chart.js
            updateChart(elevationData);
        }

        /**
         * Inicializa o Gráfico Chart.js
         */
        function initChart() {
            const ctx = document.getElementById('elevation-profile').getContext('2d');
            elevationChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [], // Distâncias
                    datasets: [{
                        label: 'Perfil de Elevação (m)',
                        data: [], // Elevações
                        borderColor: 'rgb(75, 192, 192)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        fill: true,
                        tension: 0.4, // Suaviza a linha
                        pointRadius: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'Distância Acumulada (km)'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Elevação (m)'
                            },
                            beginAtZero: false // Elevação não começa necessariamente em zero
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                title: (context) => `Distância: ${parseFloat(context[0].label).toFixed(2)} km`,
                                label: (context) => `Elevação: ${context.formattedValue} m`
                            }
                        }
                    }
                }
            });
        }

        /**
         * Atualiza os dados no Gráfico Chart.js
         */
        function updateChart(data) {
            const distances = data.map(item => item.distance.toFixed(2));
            const elevations = data.map(item => item.elevation);

            elevationChart.data.labels = distances;
            elevationChart.data.datasets[0].data = elevations;
            elevationChart.update();
        }

        /**
         * Limpa todos os dados da rota.
         */
        function clearRoute() {
            // 1. Limpa os pontos
            routePoints = [];

            // 2. Remove a Polyline
            polyline.setLatLngs([]);

            // 3. Remove os Marcadores
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];

            // 4. Reseta as métricas e o gráfico
            document.getElementById('total-distance').textContent = '0.00';
            updateChart([{ distance: 0, elevation: 0 }]);
        }

        // Inicia o aplicativo quando a página carregar
        document.addEventListener('DOMContentLoaded', initMap);
    </script>

</body>
</html>
